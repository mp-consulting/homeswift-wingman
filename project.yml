# A spike: a Mac Catalyst menu bar app that reads the Home app's homes, rooms and accessories through HomeKit
# and serves them as JSON over TLS to paired Homeswift bridges, advertised over Bonjour. `Scripts/build.sh` generates the project with XcodeGen and builds it.
name: HomeswiftWingman
options:
  bundleIdPrefix: com.mpconsulting
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0.1"
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  configs:
    AppStore:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
      ONLY_ACTIVE_ARCH: NO
      ARCHS: arm64
  base:
    DEVELOPMENT_TEAM: 4HWBUF2R8D
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HomeswiftWingman:
    type: application
    platform: iOS
    supportedDestinations: [macCatalyst]
    sources: [App]
    dependencies:
      # AppKit lives in its own bundle: a Catalyst app cannot make an NSStatusItem itself.
      - target: MenuBar
        embed: true
        codeSign: true
        platformFilter: macOS
        copy:
          destination: plugins
    # Automatic signing turns the capability on for the App ID only when the project lists it here.
    attributes:
      SystemCapabilities:
        com.apple.HomeKit:
          enabled: "1"
    info:
      path: App/Info.plist
      properties:
        LSMinimumSystemVersion: "27.0.1"
        CFBundleDisplayName: Homeswift Wingman
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        # Only Apple's TLS, CryptoKit and Security frameworks: exempt, so App Store Connect skips the export question.
        ITSAppUsesNonExemptEncryption: false
        # No window ever shows, so macOS would otherwise end the app as idle.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        LSApplicationCategoryType: public.app-category.utilities
        NSHomeKitUsageDescription: Homeswift Wingman reads your homes, rooms and accessories so your Homeswift bridge and AI assistant can see them.
        NSLocalNetworkUsageDescription: Homeswift Wingman serves your homes to the Homeswift bridges you pair with it on your network.
        NSBonjourServices: [_homeswift-wingman._tcp]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      configs:
        AppStore:
          CODE_SIGN_ENTITLEMENTS: App/AppStore.entitlements
          ENABLE_APP_SANDBOX: YES
          ENABLE_HARDENED_RUNTIME: YES
      base:
        CODE_SIGN_ENTITLEMENTS: App/HomeswiftWingman.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mpconsulting.HomeswiftWingman
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2,6"
        GENERATE_INFOPLIST_FILE: NO
  MenuBar:
    type: bundle
    platform: macOS
    sources: [MenuBar]
    info:
      path: MenuBar/Info.plist
      properties:
        NSPrincipalClass: WingmanStatusMenu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpconsulting.HomeswiftWingman.MenuBar
        PRODUCT_NAME: MenuBar
        GENERATE_INFOPLIST_FILE: NO
