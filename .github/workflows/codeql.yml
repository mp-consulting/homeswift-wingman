name: CodeQL

# Advanced setup instead of GitHub's default setup: the Xcode project is generated by XcodeGen and not committed,
# so CodeQL's autobuild finds neither a project nor a package and cannot analyze the Swift code.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build (Swift)
        if: matrix.language == 'swift'
        # Same steps as Scripts/build.sh --unsigned, but in the checkout so findings map to repository paths.
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE"
          brew install xcodegen
          xcodegen generate --quiet
          sed -i '' 's/SystemCapabilities = ".*";/SystemCapabilities = { com.apple.HomeKit = { enabled = 1; }; };/' \
              HomeswiftWingman.xcodeproj/project.pbxproj
          xcodebuild -project HomeswiftWingman.xcodeproj -scheme HomeswiftWingman -configuration Debug \
              -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath "$RUNNER_TEMP/build" \
              CODE_SIGNING_ALLOWED=NO -quiet build

      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}
